server:
  port: 8085

spring:
  application:
    name: integration-service

  # ─── Datasource (Phase 3: Hikari pool tuning) ───────────────────────────────
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/trinetra}
    username: ${POSTGRES_USER:trinetra_user}
    password: ${POSTGRES_PASSWORD:trinetra_dev_pass}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      keepalive-time: 30000
      pool-name: TriNetra-IntegrationService
      leak-detection-threshold: 60000

  # ─── JPA (Phase 3: Flyway manages schema) ───────────────────────────────────
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  # ─── Flyway Migrations ───────────────────────────────────────────────────────
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true

  # ─── RabbitMQ ───────────────────────────────────────────────────────────────
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:trinetra_admin}
    password: ${RABBITMQ_PASS:trinetra_rabbit_pass}
    template:
      receive-timeout: 60000
      reply-timeout: 30000
    listener:
      simple:
        retry:
          enabled: true
          initial-interval: 100ms
          multiplier: 2.0
          max-attempts: 3
          max-interval: 1000ms

  # ─── HTTP Request Timeout ────────────────────────────────────────────────────
  mvc:
    async:
      request-timeout: 30000

# ─── Actuator & Prometheus ──────────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics,circuitbreakers,circuitbreakerevents,retries
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}
      phase: phase3
  prometheus:
    metrics:
      export:
        enabled: true

# ─── Resilience4j ────────────────────────────────────────────────────────────
resilience4j:
  circuitbreaker:
    instances:
      webhookExternal:
        sliding-window-size: 10
        failure-rate-threshold: 50        # external: more tolerant
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 2
        minimum-number-of-calls: 5
        slow-call-duration-threshold: 20s # external webhooks can be slow
        register-health-indicator: true
      integrationRepository:
        sliding-window-size: 10
        failure-rate-threshold: 30
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 2
        minimum-number-of-calls: 5
        register-health-indicator: true
      rabbitPublish:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        minimum-number-of-calls: 5
        register-health-indicator: true
  retry:
    instances:
      webhookExternal:
        max-attempts: 3
        wait-duration: 100ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2.0
      integrationRepository:
        max-attempts: 3
        wait-duration: 100ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2.0
  timelimiter:
    instances:
      webhookExternal:
        timeout-duration: 30s             # external webhooks: 30s max
        cancel-running-future: true
      integrationRepository:
        timeout-duration: 15s
        cancel-running-future: true

# ─── Trinetra Queue Names ────────────────────────────────────────────────────
trinetra:
  queues:
    verdicts-output: verdicts.output
    dlq-failed-claims: dlq.failed_claims
    dlq-failed-evidence: dlq.failed_evidence
