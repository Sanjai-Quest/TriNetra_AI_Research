server:
  port: 8081

spring:
  application:
    name: evidence-service

  # ─── Datasource (Phase 3: Hikari pool tuning) ───────────────────────────────
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/trinetra}
    username: ${POSTGRES_USER:trinetra_user}
    password: ${POSTGRES_PASSWORD:trinetra_dev_pass}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      keepalive-time: 30000
      pool-name: TriNetra-EvidenceService
      leak-detection-threshold: 60000

  # ─── JPA (Phase 3: Flyway manages schema) ───────────────────────────────────
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  # ─── Flyway Migrations ───────────────────────────────────────────────────────
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true

  # ─── RabbitMQ ───────────────────────────────────────────────────────────────
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:trinetra_admin}
    password: ${RABBITMQ_PASS:trinetra_rabbit_pass}
    template:
      receive-timeout: 60000
      reply-timeout: 30000
    listener:
      simple:
        retry:
          enabled: true
          initial-interval: 100ms
          multiplier: 2.0
          max-attempts: 3
          max-interval: 1000ms

  # ─── File Upload ─────────────────────────────────────────────────────────────
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 30MB

  # ─── HTTP Request Timeout ────────────────────────────────────────────────────
  mvc:
    async:
      request-timeout: 30000

# ─── MinIO (with circuit breaker timeout awareness) ─────────────────────────
minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ROOT_USER:trinetra_minio}
  secret-key: ${MINIO_ROOT_PASSWORD:trinetra_minio_pass}
  bucket-name: ${MINIO_BUCKET_EVIDENCE:evidence-files}
  connect-timeout: 30s                  # HTTP: 30s
  write-timeout: 60s                    # uploads: 60s

# ─── Actuator & Prometheus ──────────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics,circuitbreakers,circuitbreakerevents,retries
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}
      phase: phase3
  prometheus:
    metrics:
      export:
        enabled: true

# ─── Resilience4j ────────────────────────────────────────────────────────────
resilience4j:
  circuitbreaker:
    instances:
      minioUpload:
        sliding-window-size: 10
        failure-rate-threshold: 40
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 2
        minimum-number-of-calls: 5
        slow-call-duration-threshold: 25s
        slow-call-rate-threshold: 50
        register-health-indicator: true
      evidenceRepository:
        sliding-window-size: 10
        failure-rate-threshold: 30
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 2
        minimum-number-of-calls: 5
        register-health-indicator: true
  retry:
    instances:
      minioUpload:
        max-attempts: 3
        wait-duration: 100ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2.0
      evidenceRepository:
        max-attempts: 3
        wait-duration: 100ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2.0
  timelimiter:
    instances:
      minioUpload:
        timeout-duration: 30s
        cancel-running-future: true
      evidenceRepository:
        timeout-duration: 15s
        cancel-running-future: true

# ─── Trinetra Queue Names ────────────────────────────────────────────────────
trinetra:
  queues:
    evidence-uploaded: evidence.uploaded
    evidence-processing: evidence.processing
    dlq-failed-evidence: dlq.failed_evidence
