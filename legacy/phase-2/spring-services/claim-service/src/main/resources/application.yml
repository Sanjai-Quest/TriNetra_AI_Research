server:
  port: 8080

spring:
  application:
    name: claim-service

  # ─── Datasource (Phase 3: Hikari pool tuning) ───────────────────────────────
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/trinetra}
    username: ${POSTGRES_USER:trinetra_user}
    password: ${POSTGRES_PASSWORD:trinetra_dev_pass}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000          # 30s: max wait to get a connection from pool
      idle-timeout: 600000               # 10min: close idle connections
      max-lifetime: 1800000              # 30min: max connection lifetime
      keepalive-time: 30000              # 30s: health-check ping interval
      pool-name: TriNetra-ClaimService
      leak-detection-threshold: 60000   # 60s: warn if connection held > 60s

  # ─── JPA (Phase 3: Flyway manages schema, JPA only validates) ───────────────
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # ─── Flyway Migrations ───────────────────────────────────────────────────────
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true

  # ─── RabbitMQ ───────────────────────────────────────────────────────────────
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:trinetra_admin}
    password: ${RABBITMQ_PASS:trinetra_rabbit_pass}
    template:
      receive-timeout: 60000             # 1min: max wait for synchronous receive
      reply-timeout: 30000              # 30s: RPC reply timeout
    listener:
      simple:
        retry:
          enabled: true
          initial-interval: 100ms
          multiplier: 2.0
          max-attempts: 3
          max-interval: 1000ms

  # ─── HTTP Request Timeout ────────────────────────────────────────────────────
  mvc:
    async:
      request-timeout: 30000            # 30s: server-side HTTP timeout

# ─── Actuator & Prometheus ──────────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics,circuitbreakers,circuitbreakerevents,retries
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}
      phase: phase3
  prometheus:
    metrics:
      export:
        enabled: true

# ─── Resilience4j — Circuit Breakers ────────────────────────────────────────
resilience4j:
  circuitbreaker:
    instances:
      claimRepository:
        sliding-window-size: 10
        failure-rate-threshold: 30              # open after 30% failures (3/10)
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 2
        minimum-number-of-calls: 5
        slow-call-duration-threshold: 10s       # calls > 10s counted as failures
        slow-call-rate-threshold: 50            # open if > 50% calls are slow
        register-health-indicator: true
        record-exceptions:
          - java.lang.Exception
        ignore-exceptions:
          - ai.trinetra.claim.exception.ClaimNotFoundException
      rabbitPublish:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 2
        minimum-number-of-calls: 5
        register-health-indicator: true

  # ─── Retry: Exponential Backoff ─────────────────────────────────────────────
  retry:
    instances:
      claimRepository:
        max-attempts: 3
        wait-duration: 100ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2.0     # 100ms → 200ms → 400ms
        retry-exceptions:
          - org.springframework.dao.TransientDataAccessException
          - org.springframework.dao.QueryTimeoutException
          - java.net.ConnectException
        ignore-exceptions:
          - ai.trinetra.claim.exception.ClaimNotFoundException
      rabbitPublish:
        max-attempts: 3
        wait-duration: 100ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2.0

  # ─── Time Limiter ────────────────────────────────────────────────────────────
  timelimiter:
    instances:
      claimRepository:
        timeout-duration: 15s                   # DB calls: 15s max
        cancel-running-future: true
      rabbitPublish:
        timeout-duration: 30s

# ─── Trinetra Queue Names ────────────────────────────────────────────────────
trinetra:
  queues:
    claims-input: claims.input
    evidence-uploaded: evidence.uploaded
    verdict-generated: verdict.generated
    dlq-failed-claims: dlq.failed_claims
